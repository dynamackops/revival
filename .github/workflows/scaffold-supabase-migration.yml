name: Scaffold Supabase migration

on:
  push:
    branches:
      - codex/foundation-verify
    paths:
      - .github/workflows/scaffold-supabase-migration.yml

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create migration with Supabase CLI
        run: npx --yes supabase@2.116.0 migration new revival_foundation
      - name: Print generated migration
        run: find supabase/migrations -maxdepth 1 -type f -name '*_revival_foundation.sql' -print
