name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check services
      - run: uv run mypy
      - run: uv run pytest

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start local Supabase
        run: npx --yes supabase@2.116.0 start
      - name: Lint database schema
        run: npx --yes supabase@2.116.0 db lint --local --level warning
      - name: Prove two-user ownership isolation
        run: npx --yes supabase@2.116.0 test db
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.116.0 stop --no-backup
