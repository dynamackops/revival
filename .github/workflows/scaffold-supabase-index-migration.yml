name: Scaffold Supabase index migration

on:
  push:
    branches:
      - codex/foundation-verify
    paths:
      - .github/workflows/scaffold-supabase-index-migration.yml

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create migration with Supabase CLI
        run: npx --yes supabase@2.116.0 migration new add_composite_foreign_key_indexes
      - name: Print generated migration
        run: find supabase/migrations -maxdepth 1 -type f -name '*_add_composite_foreign_key_indexes.sql' -print
