[build]
  base = "/"
  command = "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --filter @revival/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
  # This publishable browser key is intentionally embedded by Vite.
  # Keep Netlify's scanning enabled for every other environment variable.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_PUBLISHABLE_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
